name: loglens_flutter
description: Flutter UI for LogLens - in-app log console, floating overlay, documents-dir file persistence, and optional SharedPreferences store.
version: 0.6.1

homepage: https://github.com/InsNeed/log_lens
repository: https://github.com/InsNeed/log_lens/tree/main/packages/loglens_flutter
issue_tracker: https://github.com/InsNeed/log_lens/issues
topics:
  - logging
  - console
  - debugging

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  loglens: ^0.6.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
